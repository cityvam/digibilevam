<title>دموی زنده دیجی‌بایل پی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#161a2b;--mu:#5b6277;--bd:#e2e5ef;--pr:#4f46e5;--prx:#fff;--good:#0f7b4f;--goodb:#e3f6ec;--bad:#b42318;--badb:#fdecea;--warn:#9a5b00;--warnb:#fff3d6;--info:#1d5fb4;--infob:#e5efff;--sh:0 1px 2px rgba(20,25,50,.06),0 6px 20px rgba(20,25,50,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--sf:#171a2e;--tx:#eceefb;--mu:#a2a9c4;--bd:#2a2e4a;--pr:#8b85ff;--prx:#0e1020;--good:#5fd39b;--goodb:#12301f;--bad:#ff8f84;--badb:#3a1713;--warn:#f2c260;--warnb:#33290d;--info:#8db8ff;--infob:#13264a;--sh:none}}
:root[data-theme=dark]{--bg:#0e1020;--sf:#171a2e;--tx:#eceefb;--mu:#a2a9c4;--bd:#2a2e4a;--pr:#8b85ff;--prx:#0e1020;--good:#5fd39b;--goodb:#12301f;--bad:#ff8f84;--badb:#3a1713;--warn:#f2c260;--warnb:#33290d;--info:#8db8ff;--infob:#13264a;--sh:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.8 Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
a{color:var(--pr)}.wrap{max-width:1120px;margin:0 auto;padding:0 16px}main.wrap{padding-top:24px;padding-bottom:40px;min-height:60vh}
.skip{position:absolute;inset-inline-start:-999px}.skip:focus{inset-inline-start:8px;top:8px;background:var(--sf);padding:8px;z-index:9}
.top{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--tx);text-decoration:none;font-size:18px}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--pr);color:var(--prx)}
.top nav{display:flex;flex-wrap:wrap;gap:2px;flex:1}.top nav a{padding:6px 12px;border-radius:8px;color:var(--mu);text-decoration:none}.top nav a:hover,.top nav a.on{background:var(--bg);color:var(--tx)}
.who{display:flex;align-items:center;gap:8px}.who form{margin:0}.uname{color:var(--mu);font-size:14px}
.btn{display:inline-block;border:1px solid var(--pr);background:var(--pr);color:var(--prx);padding:10px 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;min-height:44px}
.btn.sm{padding:4px 12px;min-height:34px;font-size:14px}.btn.ghost{background:transparent;color:var(--pr)}.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:24px 0 10px}p.lead{color:var(--mu);margin:0 0 20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat .sl{color:var(--mu);font-size:14px}.stat .sv{font-size:26px;font-weight:800}.stat .ss{color:var(--mu);font-size:13px}
.hero{padding:40px 0 20px}.hero h1{font-size:34px;line-height:1.5}.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
form.f{display:grid;gap:14px;max-width:520px}label{display:grid;gap:6px;font-weight:600}label small{font-weight:400;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input.ltr,.ltr{direction:ltr;text-align:left}textarea{min-height:110px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.badge.good{background:var(--goodb);color:var(--good)}.badge.bad{background:var(--badb);color:var(--bad)}.badge.warn{background:var(--warnb);color:var(--warn)}.badge.info{background:var(--infob);color:var(--info)}.badge.mute{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.flash{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600}.flash.good{background:var(--goodb);color:var(--good)}.flash.bad{background:var(--badb);color:var(--bad)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-size:13px;background:var(--bg)}tr:last-child td{border-bottom:0}
.empty{padding:32px;text-align:center;color:var(--mu);border:1px dashed var(--bd);border-radius:14px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.sp{flex:1}.mut{color:var(--mu)}.tick{display:grid;gap:10px}
.msg{padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--bd)}.msg.staff{background:var(--infob);border-color:transparent}.msg .meta{font-size:12px;color:var(--mu)}
.bar-meter{height:10px;border-radius:9px;background:var(--bg);border:1px solid var(--bd);overflow:hidden}.bar-meter i{display:block;height:100%;background:var(--pr)}
.w10{width:10%}.w20{width:20%}.w30{width:30%}.w40{width:40%}.w50{width:50%}.w60{width:60%}.w70{width:70%}.w80{width:80%}.w90{width:90%}.w100{width:100%}.w0{width:0}
.foot{padding:24px 16px;color:var(--mu);font-size:14px;border-top:1px solid var(--bd)}
.cap{display:flex;gap:10px;align-items:center}.cap img{border-radius:8px;border:1px solid var(--bd)}
.contract{white-space:pre-wrap;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:16px;line-height:2}
@media(max-width:640px){.hero h1{font-size:26px}table{min-width:0}thead{display:none}tr{display:block;border-bottom:1px solid var(--bd);padding:8px 0}td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 14px}td::before{content:attr(data-l);color:var(--mu);font-size:13px}}
.cframe{width:100%;height:520px;border:1px solid var(--bd);border-radius:12px;background:#fff;margin:12px 0}
label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}label.chk input{width:auto;min-height:0;margin-top:6px}
ul{padding-inline-start:20px}
.stat.alert .sv{color:var(--bad)}
.docimg{max-width:100%;border-radius:10px;display:block}
.row input[name=note]{flex:1;min-width:180px}
fieldset.perms{border:1px solid var(--bd);border-radius:12px;display:grid;gap:8px;padding:12px 16px}fieldset.perms legend{font-weight:700;padding:0 6px}
.stack{display:grid;gap:16px}.stack form.f{max-width:none}td .ltr{white-space:nowrap}
form.f.wide{max-width:none}textarea.code{font:13px/1.7 ui-monospace,Consolas,monospace;direction:ltr;text-align:left;min-height:120px}textarea.tall{min-height:260px}.card.sub{box-shadow:none;background:var(--bg)}.flash ul{margin:6px 0 0}

/* ======== صفحه‌ی عمومی: هدر/فوتر و صفحه‌ی اصلی دیجی‌بایل ======== */
.area-public{--hb:#1e6df2;--hb-d:#1556c4;--nv:#0b2c63;--nv2:#0a2250;--hsoft:color-mix(in srgb,var(--hb) 9%,var(--sf));--pw:min(1200px,100% - 2*max(16px,env(safe-area-inset-left,0px)))}
.pub-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:0 1px 0 rgba(10,30,70,.03)}
.pub-bar{width:var(--pw);margin:0 auto;display:flex;align-items:center;gap:20px;min-height:64px}
.pub-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);flex:none}.pub-brand span{display:flex;flex-direction:column;line-height:1.25}.pub-brand b{font-size:21px;font-weight:800;color:var(--nv)}.pub-brand small{font-size:11.5px;color:var(--mu)}
.pub-brand.inv b{color:#fff}.pub-brand.inv small{color:#a9bde0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pub-brand b{color:#dce8ff}}:root[data-theme=dark] .pub-brand b{color:#dce8ff}
.pub-bar nav{flex:1;display:flex;justify-content:center;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.pub-bar nav a{position:relative;padding:20px 11px;font-size:14px;font-weight:600;color:var(--tx);text-decoration:none;white-space:nowrap}
.pub-bar nav a:hover{color:var(--hb)}.pub-bar nav a.on{color:var(--hb)}.pub-bar nav a.on::after{content:"";position:absolute;inset-inline:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--hb)}
.pub-who{display:flex;align-items:center;gap:10px;flex:none}.pub-who form{margin:0}
.pub-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--sf);color:var(--mu);cursor:pointer;padding:0}.pub-ic svg{width:19px;height:19px}.pub-ic:hover{color:var(--hb);border-color:var(--hb)}
.pub-login{display:inline-flex;align-items:center;min-height:40px;padding:0 22px;border-radius:10px;background:var(--hb);color:#fff;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}.pub-login:hover{background:var(--hb-d)}
.pub-main{width:var(--pw);margin:0 auto;padding-block:24px}.area-public main>.wrap{padding-top:12px}
.area-public .btn{background:var(--hb);border-color:var(--hb);color:#fff}.area-public .btn.ghost{background:transparent;color:var(--hb)}
.pub-foot{background:var(--nv2);color:#c8d6f0;margin-top:8px}
.pub-foot-in{width:var(--pw);margin:0 auto;padding-block:22px;display:grid;grid-template-columns:auto 1fr auto;gap:12px 28px;align-items:center}
.pub-foot nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}.pub-foot nav a{color:#c8d6f0;text-decoration:none;font-size:13.5px}.pub-foot nav a:hover{color:#fff}
.soc{display:flex;gap:10px}.soc span{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#ffffff14;color:#dbe6fb}.soc svg{width:17px;height:17px}
.pub-foot p{grid-column:1/-1;margin:0;text-align:center;font-size:12.5px;color:#8fa7d2;border-top:1px solid #ffffff1c;padding-top:12px}
/* صفحه‌ی اصلی: کل عرض */
.area-public .pub-main:has(.home){width:100%;padding-block:0}
.home{--c:var(--pw)}
.home>section{width:var(--pw);margin-inline:auto}
.home>.hero{width:100%;position:relative;overflow:hidden;background:var(--nv);color:#fff;isolation:isolate}
.hero-art{position:absolute;inset:0 auto 0 0;width:50%;height:100%;z-index:-2;-webkit-mask-image:linear-gradient(to left,transparent 0,#000 24%);mask-image:linear-gradient(to left,transparent 0,#000 24%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(270deg,rgba(7,24,58,.97) 0,rgba(9,32,76,.9) 48%,rgba(9,32,76,.25) 72%,rgba(9,32,76,0) 100%)}
.hero-in{width:var(--pw);margin:0 auto;display:grid;grid-template-columns:minmax(300px,350px) 1fr;gap:28px;padding-block:26px;align-items:center;min-height:410px}
.hc{background:var(--sf);color:var(--tx);border-radius:14px;box-shadow:0 14px 40px rgba(4,16,44,.35);overflow:hidden;align-self:center}
.hc-tabs{display:grid;grid-template-columns:1fr 1fr;background:color-mix(in srgb,var(--tx) 6%,var(--sf));padding:6px;gap:4px;margin:12px 12px 0;border-radius:10px}
.hc-tabs button{font:inherit;font-weight:700;font-size:13.5px;padding:8px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mu);cursor:pointer}
.hc-tabs button.on{background:var(--sf);color:var(--hb);border-color:color-mix(in srgb,var(--hb) 45%,var(--sf));box-shadow:0 1px 3px rgba(20,40,90,.12)}
.hc-body{padding:14px 18px 18px;display:grid;gap:8px}.hc-l{display:block;font-size:12.5px;font-weight:700;color:var(--tx);margin-bottom:4px}
.hc-amt{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;border:1px solid var(--bd);border-radius:9px;padding:9px 12px;font-weight:800;font-size:18px}.hc-amt span{font-size:12.5px;font-weight:600;color:var(--mu)}.hc-amt output{direction:ltr}
.hc-range{appearance:none;-webkit-appearance:none;width:100%;height:20px;padding:0;border:0;min-height:0;background:transparent;margin:6px 0 0;direction:rtl;cursor:pointer}
.hc-range::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(to left,var(--hb) var(--p,50%),color-mix(in srgb,var(--hb) 18%,var(--sf)) 0)}.hc-range::-moz-range-track{height:5px;border-radius:5px;background:color-mix(in srgb,var(--hb) 18%,var(--sf))}.hc-range::-moz-range-progress{height:5px;border-radius:5px;background:var(--hb)}
.hc-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:var(--sf);border:4px solid var(--hb);cursor:pointer}.hc-range::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--sf);border:4px solid var(--hb);cursor:pointer}
.hc-range:focus-visible{outline:3px solid color-mix(in srgb,var(--hb) 50%,transparent);outline-offset:6px}
.hc-scale{display:flex;justify-content:space-between;flex-direction:row-reverse;font-size:11px;color:var(--mu)}
.hc-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hc select{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);min-height:40px}
.hc-res{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--hsoft);border-radius:10px;padding:12px;margin-top:2px}.hc-res small{display:block;font-size:11px;color:var(--mu)}.hc-res b{font-size:17px;color:var(--hb);font-weight:800}.hc-res i{font-style:normal;font-size:11.5px;font-weight:600;color:var(--tx)}
.hc-go{display:grid;place-items:center;min-height:44px;border-radius:10px;background:var(--hb);color:#fff;font-weight:700;text-decoration:none;margin-top:4px}.hc-go:hover{background:var(--hb-d)}
.hc-p{margin:4px 0;font-size:13.5px;color:var(--mu)}.hc-ol{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:14px}
.hs-text{max-width:430px;margin-inline-start:0;margin-inline-end:auto;text-align:start}
.hs-k{font-size:15px;color:#cfe0ff;margin-bottom:8px}.hs h1{margin:0 0 12px;font-size:clamp(24px,3.2vw,34px);line-height:1.5;font-weight:800;color:#fff;text-wrap:balance}.hs h1 em{font-style:normal;color:#5fa8ff}
.hs p{margin:0 0 18px;color:#dbe7fb;font-size:14.5px;line-height:1.95;max-width:440px}
.hs-cta{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 24px;border-radius:12px;background:#2a7bff;color:#fff;font-weight:700;text-decoration:none;box-shadow:0 8px 20px rgba(20,90,230,.4)}.hs-cta:hover{background:#1f6af0}.hs-cta svg{width:16px;height:16px}
.hs-nav{position:absolute;top:50%;translate:0 -50%;z-index:2;width:30px;height:46px;display:grid;place-items:center;background:#ffffff26;border:0;border-radius:8px;color:#fff;cursor:pointer;padding:0}.hs-nav:hover{background:#ffffff40}.hs-nav svg{width:18px;height:18px}
.hs-next{left:10px}.hs-prev{right:10px}
.hs-dots{position:absolute;bottom:14px;left:50%;translate:-50% 0;display:flex;gap:7px;z-index:2}.hs-dots button{width:8px;height:8px;border-radius:50%;border:0;background:#ffffff66;padding:0;cursor:pointer}.hs-dots button.on{background:#fff;width:20px;border-radius:5px}
.hs{display:contents}
.feats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding-block:22px}
.feat{display:flex;align-items:center;gap:12px;padding:6px 12px;border-inline-start:1px solid var(--bd)}.feat:first-child{border-inline-start:0}
.ficon{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;flex:none;--c:var(--hb);background:color-mix(in srgb,var(--c) 13%,var(--sf));color:var(--c)}.ficon svg{width:24px;height:24px}
.f-sky{--c:#1b9ad6}.f-ind{--c:#4f5be8}.f-green{--c:#17a673}
.feat b{display:block;font-size:14.5px}.feat small{display:block;font-size:12px;color:var(--mu);line-height:1.6}
.plans{padding-block:6px 28px}.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}.sec-h h2{margin:0;font-size:21px;font-weight:800}.sec-h p{margin:2px 0 0;font-size:13px;color:var(--mu)}
.all{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--bd);border-radius:9px;background:var(--sf);color:var(--hb);font-weight:700;font-size:13px;text-decoration:none}.all svg,.plan-more svg{width:14px;height:14px}
.plan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.plan{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);box-shadow:0 2px 10px rgba(20,40,90,.05);text-decoration:none;color:var(--tx);min-width:0}.plan:hover{border-color:var(--hb);box-shadow:0 8px 22px rgba(30,109,242,.14)}
.plan-top{display:flex;gap:10px;align-items:flex-start;min-width:0}.plan-img{width:76px;flex:none;border-radius:9px;overflow:hidden;order:2}.plan-tx{min-width:0;flex:1}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--hb);border-radius:6px;padding:1px 8px;margin-bottom:6px}.plan h3{margin:0;font-size:14.5px;font-weight:800}.plan p{margin:2px 0 0;font-size:11.5px;color:var(--mu);line-height:1.6}
.plan-meta{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700;border-top:1px dashed var(--bd);padding-top:9px;flex-wrap:wrap}.plan-meta span:last-child{color:var(--mu)}
.plan-more{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--hb)}
.why{width:100%!important;background:linear-gradient(100deg,#0a2a63,#0f3f8c 55%,#0a2a63);color:#fff;margin-block:4px}
.why-in{width:var(--pw);margin:0 auto;display:grid;grid-template-columns:1fr auto auto;gap:28px;align-items:center;padding-block:20px}
.why-t h2{margin:0 0 4px;font-size:22px;font-weight:800;color:#fff}.why-t p{margin:0;font-size:13.5px;color:#cfe0ff}
.why-list{display:grid;grid-template-columns:repeat(3,auto);gap:30px}.why-i{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}.why-ic{grid-row:span 2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#ffffff18;color:#8cc0ff}.why-ic svg{width:24px;height:24px}.why-i b{font-size:14px}.why-i small{font-size:12px;color:#b9cdee}
.why-app{display:flex;align-items:center;gap:6px;background:#fff;color:#0b2c63;border-radius:14px;padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25);min-width:270px}.why-app b{font-size:16px;color:#0b2c63}.why-app p{margin:2px 0 8px;font-size:12px;color:#55638a}.phone-art{width:78px;flex:none}
.why-dl{display:inline-block;background:#1e6df2;color:#fff;font-size:12.5px;font-weight:700;padding:6px 16px;border-radius:8px}
.steps{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:center;padding-block:22px 34px}.steps-h h2{margin:0;font-size:19px;font-weight:800}.steps-h p{margin:2px 0 0;font-size:12.5px;color:var(--mu)}
.steps-l{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;position:relative}
.steps-l::before{content:"";position:absolute;top:19px;inset-inline:6%;border-top:2px dashed color-mix(in srgb,var(--hb) 35%,var(--bd))}
.steps-l li{position:relative;display:grid;gap:6px;justify-items:center;text-align:center}.sn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--hb);color:#fff;font-weight:800;box-shadow:0 0 0 5px var(--bg)}
.steps-l b,.steps-l small{display:block}.steps-l b{font-size:13px}.steps-l small{font-size:11.5px;color:var(--mu);line-height:1.6;max-width:140px}
